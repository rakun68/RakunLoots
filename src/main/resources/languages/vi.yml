# Gui cho ca may chu. {box_name} la ten loot, {box_world} the gioi, {box_lifespan} va {box_locked} la so giay song va khoa,
# {box_x} {box_y} {box_z} la vi tri that, {from_x} den {to_z} la khu vuc gan dung. Loot co the viet lai bat ky dong nao.
lootbox_spawned_broadcast: |-
  {prefix} &cMot loot vua xuat hien!&r
  &f&m<------------------------------>&r
   &f| &bTen&7: &r{box_name}
   &f| &bBien mat sau&7: &c{box_lifespan}&7s
   &f| &bMo khoa sau&7: &c{box_locked}&7s
   &f| &bThe gioi&7: &c{box_world}
   &f| &bVi tri&7: quanh &c{from_x} {from_y} {from_z}&7
   &7den &c{to_x} {to_y} {to_z} &7!
  &f&m<------------------------------>&r
lootbox_removed_broadcast: "{prefix} {box_name}&r&7 tai &c{box_x} {box_y} {box_z} &7trong &c{box_world} &7 da bi &clay het &7hoac &cxoa bo &7!"
