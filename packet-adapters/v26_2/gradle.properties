# The Spigot build this adapter is written and tested against: BuildTools --rev 26.2.
minecraftVersion=26.2
# The Java that 26.2 servers run, and that BuildTools needs to build it: Spigot's versions/26.2.json lists class
# versions 69 and 70, Java 25 and 26.
javaLevel=25
# The class version it compiles to, Java 21, so Paper's plugin remapper on 1.20.6 to 1.21.5, which cannot read newer
# classes, loads the plugin jar. The JDK 25 toolchain still compiles it, since the server jar it links is Java 25 bytecode.
bytecodeLevel=21
# Minecraft ships unobfuscated from 26.1, and Spigot, Paper, and Folia all run Mojang's names and an unversioned
# CraftBukkit package, so the shipped jar is the adapter as compiled.
mappings=mojang
