# The Spigot build this adapter is written and tested against: BuildTools --rev 1.20.6 --remapped.
minecraftVersion=1.20.6
# The Java that 1.20.5 and 1.20.6 servers run, and that BuildTools needs to build it.
javaLevel=21
# Spigot 1.20.6 runs Spigot's names, so the shipped jar is remapped to them. Paper runs Mojang's names from 1.20.5 and
# remaps a plugin in Spigot's names to them as it loads it, so the same jar runs on both.
mappings=spigot
