# The Spigot build this adapter is written and tested against: BuildTools --rev 1.18.1 --remapped.
minecraftVersion=1.18.1
# The Java that 1.18.1 servers run, and that BuildTools needs to build it.
javaLevel=17
# 1.18.1 servers run Spigot's names, so the shipped jar is remapped to them.
mappings=spigot
