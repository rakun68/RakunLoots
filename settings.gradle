plugins {
    // Downloads the JDK a toolchain asks for when none is installed, such as Java 25 for the FancyHolograms provider.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.9.0'
}

rootProject.name = 'RakunLoots'

// One packet adapter subproject per NMS revision, in packet-adapters/<revision> (ADR 0012). Its gradle.properties names
// the Spigot build it compiles against, its Java level, and its mappings; build.gradle configures every one the same
// way and puts it into the plugin jar.
[
        'v1_18_R1', 'v1_18_R2', 'v1_19_R1', 'v1_19_R2', 'v1_19_R3', 'v1_20_R1', 'v1_20_R2', 'v1_20_R3', 'v1_20_R4',
        'v1_21_R1', 'v1_21_R2', 'v1_21_R3', 'v1_21_R4', 'v1_21_R5', 'v1_21_R6', 'v1_21_R7',
        // From 26.1 CraftBukkit has no versioned package, so these are named after the release, with a v in front since
        // a Java package cannot start with a digit.
        'v26_1', 'v26_2',
].each { revision ->
    include(revision)
    project(":$revision").projectDir = file("packet-adapters/$revision")
}
