# How serious each warning is. Each line is a warning kind and its severity: low, high, severe, or off.
# Changing a severity is at your own risk. A warning you lower or turn off can hide a broken loot or a lost box, and the
# plugin will not tell you. Leave a line alone unless you know the warning is harmless on this server.
#
# low, high, and severe set how the warning is logged, and warning-level in config.yml decides which of them reach the
# log. off drops the warning: it is not logged and /rkl warnings does not list it. /rkl warnings shows each warning at
# the severity set here, and lists a warning the warning level keeps out of the log with a mark.
# A kind left out of this file keeps its default. A name that is no kind warns low. Every kind is listed below at its
# default, except LOOT_LANGUAGE_CLASH, which is off: a loot written in another language than the server's still loads.
# A reload picks up a change.

