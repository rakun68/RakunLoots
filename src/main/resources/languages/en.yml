command_remove_near_summary: "Removes the loot boxes around you."
command_remove_near_description: "Ends every loot box within the radius of where you stand as an admin removal. Only a player can use it."
command_remove_near_example: "/rkl remove near 20"
command_remove_near_arg_radius: "How far from you, in blocks."
