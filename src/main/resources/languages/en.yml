command_help_summary: "Lists the commands you can run, or explains one."
command_help_description: "Without a command it lists every command you can run. With a command it shows how to use that command."
command_help_example: "/rkl help remove world"
command_help_arg_command: "The command to explain, such as remove world. Leave it out to list every command."
cmd_remove_done: "{prefix} Removed &e{amount} &7loot box(es)."
cmd_remove_near_needs_player: "{prefix} &cOnly a player can use remove near, because it measures from where you stand."
cmd_remove_world_not_loaded: "{prefix} &cThe world &f{world} &cis not loaded."
command_remove_summary: "Removes loot boxes."
command_remove_description: "Ends the chosen loot boxes as admin removals. They drop nothing and give no block item, and a block is only taken away while it is still the loot box."
command_remove_example: "/rkl remove near 20"
command_remove_all_summary: "Removes every loot box."
command_remove_all_description: "Ends every loot box on the server as an admin removal."
command_remove_all_example: "/rkl remove all"
command_remove_world_summary: "Removes the loot boxes of one world."
command_remove_world_description: "Ends every loot box in that world as an admin removal."
