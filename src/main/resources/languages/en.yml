prefix: "&f[&bRakunLoots&f]&7"
still_locked: "{prefix} This loot is still &clocked &7and you are &cnot the owner &7!"
loot_not_found: "{prefix} &7Can not find loot with id &c{name} &7!"
can_not_spawn_loot: "{prefix} There is &cno suitable location &7for a loot to spawn !"
# A summon that placed no loot box. A summon item goes back to the player.
summon_spot_held: "{prefix} &7Another loot is already coming down on that spot !"
summon_block_changed: "{prefix} &7The spot changed before the loot could land !"
summon_block_refused: "{prefix} &7The server refused this loot's block !"
summon_failed: "{prefix} &7The loot could not be made !"
summon_chunk_unloaded: "{prefix} &7The spot's chunk unloaded before the loot could land !"
summon_interrupted: "{prefix} &7The summon was cut short by a reload or a stop !"
# Lines above a loot box. {name} is the loot's name, {owner} its owner, {lock} and {life} the time left.
hologram_lines:
  - "&f&l<< &r{name} &f&l>>"
  - "&7Owner: &e{owner}"
  - "&7Lock: &c{lock}"
  - "&7Leaves in: &e{life}"
hologram_unlocked: "&aUnlocked"
hologram_no_owner: "&7No owner"
hologram_unending: "&aUnending"

# Sent to the whole server. {box_name} is the loot's name, {box_world} the world, {box_lifespan} and {box_locked} the
# seconds of life and lock, {box_x} {box_y} {box_z} the real spot, {from_x} to {to_z} the rough area. A loot's messages
# can reword any of them.
lootbox_spawned_broadcast: |-
  {prefix} &cA loot has just spawned!&r
  &f&m<------------------------------>&r
   &f| &bName&7: &r{box_name}
   &f| &bDespawn in&7: &c{box_lifespan}&7s
   &f| &bUnlocked in&7: &c{box_locked}&7s
   &f| &bWorld&7: &c{box_world}
   &f| &bLocation&7: around &c{from_x} {from_y} {from_z}&7
   &7to &c{to_x} {to_y} {to_z} &7!
  &f&m<------------------------------>&r
lootbox_removed_broadcast: "{prefix} {box_name}&r&7 at &c{box_x} {box_y} {box_z} &7in &c{box_world} &7 has been &clooted &7or &cremoved &7!"
# Sent to a loot box's owner when it ends, for a loot with message_owner_on_remove_enable: true.
message_owner_on_remove: "{prefix} &7Your {box_name} &r&7at &c{box_x} {box_y} {box_z} &r&7has disappeared."
# Commands. A failed command shows the line as typed, then the reason and the type it expected.
cmd_unknown: "{prefix} &cUnknown command."
cmd_use_help: "{prefix} Use &e{usage} &7to list the commands you can run."
cmd_failure_typed: "{prefix} &f/{line}"
cmd_failure_reason: "&8> &c{reason}&7, expected &e{type}&7.{suggestions}"
cmd_failure_suggestions: " Did you mean &e{matches}&7?"
