cmd_warnings_previous: "&a[< Previous]"
cmd_warnings_next: "&a[Next >]"
cmd_warnings_console_next: "&7Next page: &e{command}"
cmd_claim_needs_player: "{prefix} &cOnly a player can take summon items, because they go into an inventory."
cmd_wiki_needs_player: "{prefix} &cOnly a player can open the loots wiki, because it shows the world they are in."
command_reload_summary: "Reloads the plugin."
command_reload_description: "Abandons every pending summon and gives its summon item back, then reloads the config, the loots, the languages, the world timers, and the holograms."
command_reload_example: "/rkl reload"
command_list_summary: "Lists the loot ids."
command_list_description: "Lists the id of every loaded loot."
command_list_example: "/rkl list"
command_give_summary: "Gives summon items."
command_give_description: "Gives summon items of a loot to a player, or to you when no player is named. What does not fit, or all of it for a player who is offline, waits as unclaimed summon items for the claim command."
command_give_example: "/rkl give airdrops Steve 3"
command_give_arg_loot: "The loot whose summon item to give."
command_give_arg_player: "The player to give to, online or not. Leave it out to give to yourself."
command_give_arg_amount: "How many to give. Leave it out for 1."
command_summon_summary: "Summons a loot now."
command_summon_description: "Summons a loot as the world timer would. With a world it searches that world. With a player it summons in the loot's player ring around that player. The loot box has no owner. Leave the target out to search your own world."
command_summon_example: "/rkl summon airdrops world"
command_summon_arg_loot: "The loot to summon."
command_summon_arg_target: "A world to search, or an online player to summon around."
command_timer_summary: "Runs a world's timer summon now."
command_timer_description: "Starts the world's timer full again and runs one timer summon with its usual checks, and tells you why when one refuses it. --force skips the minimum player count and the spawn limit, and nothing else."
command_timer_example: "/rkl timer world now --force"
command_timer_arg_world: "The world whose timer to run."
command_timer_arg_now: "The word now."
command_timer_arg_force: "Skips the minimum player count and the spawn limit."
command_warnings_summary: "Lists the warnings since the last reload."
command_warnings_description: "Lists every warning kind raised since the last enable or reload, severe first, with its count and its first 3 subjects. A kind below the warning level is listed and marked. 10 kinds a page."
command_warnings_example: "/rkl warnings high 2"
command_warnings_arg_severity: "The lowest severity to show: low, high, or severe. Leave it out for low."
command_warnings_arg_page: "The page, 10 lines each. Leave it out for page 1."

# Summon items a player is owed. {amount} is how many, {loot} the loot's name, {command} the claim command's name.
unclaimed_summon_items_waiting: "{prefix} You have &e{amount} &7summon item(s) waiting. Take them with &e/{command}&7."
claim_nothing: "{prefix} You have no summon items waiting."
claim_given: "{prefix} You took &e{amount} &7summon item(s) of &r{loot}&7."
claim_kept: "{prefix} Your inventory is full. &e{amount} &7summon item(s) of &r{loot} &7stay waiting. Make room and take them with &e/{command}&7."
claim_loot_missing: "{prefix} &e{amount} &7summon item(s) of &c{loot} &7stay waiting, because that loot does not exist now."

# Added to a file that is not valid YAML when the error is on a line with a brace. {line} is that line.
yaml_quote_hint: 'Line {line} holds a {. Put the whole value in quotes, for example key: "text {name}".'

