# The Spigot build this adapter is written and tested against: BuildTools --rev 1.21.11 --remapped.
minecraftVersion=1.21.11
# BuildTools installs 1.21.11's Spigot build as R0.2, not R0.1.
spigotVersion=1.21.11-R0.2-SNAPSHOT
# The Java that 1.21.11 servers run, and that BuildTools needs to build it.
javaLevel=21
# Spigot 1.21.11 runs Spigot's names, so the shipped jar is remapped to them. Paper runs Mojang's names from 1.20.5 and
# remaps a plugin in Spigot's names to them as it loads it, so the same jar runs on both.
mappings=spigot
