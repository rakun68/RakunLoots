# Sent to a player who uses a summon item: when it is used, and when its loot box lands. {box_name} is the loot's name.
summon_item_used: "{prefix} &7正在召唤 {box_name}&r&7……"
summon_item_landed: "{prefix} &7你的 {box_name} &r&7已降落在 &e{box_x} {box_y} {box_z}&7！"
# 战利品箱上方的文字。{name} 为战利品名称，{owner} 为所有者，{lock} 和 {life} 为剩余时间。
hologram_lines:
  - "&f&l<< &r{name} &f&l>>"
  - "&7所有者：&e{owner}"
  - "&7锁定：&c{lock}"
  - "&7剩余时间：&e{life}"
hologram_unlocked: "&a已解锁"
hologram_no_owner: "&7无所有者"
hologram_unending: "&a永久"

# 发送给整个服务器。{box_name} 为战利品名称，{box_world} 为世界，{box_lifespan} 和 {box_locked} 为存活和锁定的秒数，
# {box_x} {box_y} {box_z} 为真实位置，{from_x} 到 {to_z} 为大致范围。战利品可以重写其中任何一条。
lootbox_spawned_broadcast: |-
  {prefix} &c一个战利品刚刚生成！&r
  &f&m<------------------------------>&r
   &f| &b名称&7: &r{box_name}
   &f| &b消失于&7: &c{box_lifespan}&7秒后
   &f| &b解锁于&7: &c{box_locked}&7秒后
   &f| &b世界&7: &c{box_world}
   &f| &b位置&7: 大约在 &c{from_x} {from_y} {from_z}&7
   &7到 &c{to_x} {to_y} {to_z} &7之间！
  &f&m<------------------------------>&r
lootbox_removed_broadcast: "{prefix} {box_name}&r&7 位于 &c{box_world} &7的 &c{box_x} {box_y} {box_z} &7已被&c拾取&7或&c移除&7！"
# 战利品箱结束时发送给其所有者，适用于 message_owner_on_remove_enable: true 的战利品。
message_owner_on_remove: "{prefix} &7你位于 &c{box_x} {box_y} {box_z} &r&7的 {box_name} &r&7已经消失。"
